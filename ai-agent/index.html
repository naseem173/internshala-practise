<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint Agent</title>
<meta name="description" content="Waypoint — a tool-using task agent that plans and executes multi-step requests: math, dates, units, text, JSON, and goal breakdowns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141c;
    --bg-grid: rgba(120,140,255,0.05);
    --panel: #1a1d29;
    --panel-alt: #20232f;
    --panel-raised: #262a38;
    --text: #e4e6ee;
    --text-dim: #9298ac;
    --text-faint: #656b80;
    --border: rgba(228,230,238,0.10);
    --border-strong: rgba(228,230,238,0.18);
    --thought: #f2b84b;
    --thought-bg: rgba(242,184,75,0.10);
    --action: #5b8dff;
    --action-bg: rgba(91,141,255,0.12);
    --obs: #4fd6a0;
    --obs-bg: rgba(79,214,160,0.10);
    --err: #ff6b6b;
    --err-bg: rgba(255,107,107,0.10);
    --shadow: 0 2px 8px rgba(0,0,0,0.25), 0 20px 48px -20px rgba(0,0,0,0.6);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
      var(--bg);
    background-size: 28px 28px, 28px 28px, auto;
    color: var(--text);
    font-family:'Sora', ui-sans-serif, system-ui, sans-serif;
    line-height:1.55;
  }
  ::selection{ background: var(--action-bg); color:#fff; }
  a{ color: var(--action); }
  code, .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

  .app{ max-width:1180px; margin:0 auto; padding: 28px 24px 60px; min-height:100%; display:flex; flex-direction:column; }

  header{ display:flex; align-items:center; justify-content:space-between; padding-bottom:22px; border-bottom:1px solid var(--border); margin-bottom:26px; flex-wrap:wrap; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.15rem; letter-spacing:-0.01em; }
  .brand .mark{ color: var(--action); font-size:1.1rem; }
  .brand .sub{ font-family:'IBM Plex Mono'; font-weight:400; font-size:0.72rem; color:var(--text-faint); margin-left:6px; }
  .status{ font-family:'IBM Plex Mono'; font-size:0.76rem; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
  .status .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--obs); box-shadow:0 0 0 3px rgba(79,214,160,0.18); }

  .layout{ display:grid; grid-template-columns: 1fr 300px; gap:28px; flex:1; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }

  .console{ display:flex; flex-direction:column; gap:16px; min-width:0; }

  .trace{
    background: var(--panel); border:1px solid var(--border); border-radius:10px;
    padding: 18px 18px 6px; min-height:360px; max-height:56vh; overflow-y:auto;
    box-shadow: var(--shadow);
    display:flex; flex-direction:column; gap:14px;
  }
  .trace::-webkit-scrollbar{ width:8px; }
  .trace::-webkit-scrollbar-thumb{ background: var(--panel-raised); border-radius:8px; }

  .msg{ display:flex; flex-direction:column; gap:6px; padding-bottom:14px; border-bottom:1px dashed var(--border); }
  .msg:last-child{ border-bottom:none; }
  .msg .role{ font-family:'IBM Plex Mono'; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; display:flex; align-items:center; gap:7px; }
  .msg .role .dot{ width:6px; height:6px; border-radius:50%; display:inline-block; }
  .msg .body{ font-size:0.92rem; white-space:pre-wrap; }

  .msg.goal .role{ color: var(--text-dim); }
  .msg.goal .role .dot{ background: var(--text-dim); }
  .msg.goal .body{ font-weight:600; font-size:1rem; }

  .msg.thought .role{ color: var(--thought); }
  .msg.thought .role .dot{ background: var(--thought); }
  .msg.thought .body{ color: var(--text-dim); background:var(--thought-bg); border-radius:6px; padding:8px 10px; }

  .msg.action .role{ color: var(--action); }
  .msg.action .role .dot{ background: var(--action); }
  .msg.action .body{ font-family:'IBM Plex Mono'; font-size:0.82rem; background:var(--action-bg); border-radius:6px; padding:8px 10px; }

  .msg.observation .role{ color: var(--obs); }
  .msg.observation .role .dot{ background: var(--obs); }
  .msg.observation .body{ font-family:'IBM Plex Mono'; font-size:0.86rem; background:var(--obs-bg); border-radius:6px; padding:10px 12px; white-space:pre-wrap; }

  .msg.error .role{ color: var(--err); }
  .msg.error .role .dot{ background: var(--err); }
  .msg.error .body{ background:var(--err-bg); border-radius:6px; padding:8px 10px; }

  .msg.answer .body{ font-size:1rem; font-weight:600; padding:10px 12px; background: var(--panel-alt); border-radius:8px; border:1px solid var(--border-strong); }

  #composer{ display:flex; gap:10px; }
  #goalInput{
    flex:1; background: var(--panel); border:1px solid var(--border-strong); border-radius:8px;
    padding:14px 16px; color:var(--text); font-family:'IBM Plex Mono'; font-size:0.9rem;
    outline:none; transition:border-color 0.15s ease;
  }
  #goalInput:focus{ border-color: var(--action); }
  #goalInput::placeholder{ color: var(--text-faint); }
  #composer button{
    font-family:'Sora'; font-weight:600; font-size:0.88rem; color:#0d0f16; background: var(--action);
    border:none; border-radius:8px; padding:0 22px; cursor:pointer; transition:filter 0.15s ease;
  }
  #composer button:hover{ filter:brightness(1.08); }
  #composer button:active{ transform: translateY(1px); }

  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    font-family:'IBM Plex Mono'; font-size:0.74rem; color:var(--text-dim); background:var(--panel);
    border:1px solid var(--border); border-radius:999px; padding:6px 13px; cursor:pointer; transition: all 0.15s ease;
  }
  .chip:hover{ color:var(--text); border-color:var(--border-strong); background:var(--panel-alt); }

  .tools-panel{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; box-shadow:var(--shadow); }
  .tools-panel h2{ font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin:0 0 14px; font-weight:600; }
  #toolList{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  #toolList li{ display:flex; gap:10px; align-items:flex-start; }
  #toolList .tool-dot{ width:7px; height:7px; border-radius:50%; background:var(--action); margin-top:6px; flex-shrink:0; }
  #toolList .tool-name{ font-family:'IBM Plex Mono'; font-size:0.8rem; color:var(--text); font-weight:600; }
  #toolList .tool-desc{ font-size:0.78rem; color:var(--text-dim); margin-top:2px; }

  footer.note{ margin-top:22px; font-family:'IBM Plex Mono'; font-size:0.72rem; color:var(--text-faint); text-align:center; }
  footer.note a{ color:var(--text-dim); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark">◆</span> Waypoint<span class="sub">/ task agent</span></div>
    <div class="status"><span class="status-dot"></span>Ready — 6 tools online</div>
  </header>

  <div class="layout">
    <div class="console">
      <div class="trace" id="trace"></div>
      <form id="composer">
        <input id="goalInput" type="text" placeholder="Give it a goal — e.g. “convert 12 miles to km”" autocomplete="off" />
        <button type="submit">Run →</button>
      </form>
      <div class="chips" id="chips"></div>
    </div>

    <aside class="tools-panel">
      <h2>Available tools</h2>
      <ul id="toolList"></ul>
    </aside>
  </div>

  <footer class="note">Everything here runs locally in your browser — no external API, no data leaves this page.</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     Tool 1: calculator — small recursive-descent expression parser
     supports + - * / % ^ ( ) decimals, and unary minus
  --------------------------------------------------------- */
  function evalExpression(src){
    let i = 0;
    function peek(){ return src[i]; }
    function skipWs(){ while (src[i] === ' ') i++; }
    function parseNumber(){
      skipWs();
      let start = i;
      if (src[i] === '+' || src[i] === '-') i++;
      let sawDigit = false;
      while (i < src.length && /[0-9]/.test(src[i])) { i++; sawDigit = true; }
      if (src[i] === '.') { i++; while (i < src.length && /[0-9]/.test(src[i])) { i++; sawDigit = true; } }
      if (!sawDigit) throw new Error("expected a number at position " + start);
      return parseFloat(src.slice(start, i));
    }
    function parseFactor(){
      skipWs();
      if (src[i] === '(') {
        i++;
        const v = parseExpr();
        skipWs();
        if (src[i] !== ')') throw new Error("missing closing parenthesis");
        i++;
        return v;
      }
      if (src[i] === '-') { i++; return -parseFactor(); }
      if (src[i] === '+') { i++; return parseFactor(); }
      return parseNumber();
    }
    function parsePow(){
      let base = parseFactor();
      skipWs();
      if (src[i] === '^') { i++; const exp = parsePow(); return Math.pow(base, exp); }
      return base;
    }
    function parseTerm(){
      let v = parsePow();
      skipWs();
      while (src[i] === '*' || src[i] === '/' || src[i] === '%') {
        const op = src[i]; i++;
        const rhs = parsePow();
        if (op === '*') v *= rhs;
        else if (op === '/') { if (rhs === 0) throw new Error("division by zero"); v /= rhs; }
        else v %= rhs;
        skipWs();
      }
      return v;
    }
    function parseExpr(){
      let v = parseTerm();
      skipWs();
      while (src[i] === '+' || src[i] === '-') {
        const op = src[i]; i++;
        const rhs = parseTerm();
        v = op === '+' ? v + rhs : v - rhs;
        skipWs();
      }
      return v;
    }
    const result = parseExpr();
    skipWs();
    if (i < src.length) throw new Error("unexpected character '" + src[i] + "'");
    return result;
  }

  function runCalculator(text){
    // "15% tip on 82.50" / "20% of 340" style
    let m = text.match(/([\d.]+)\s*%\s*(?:tip on|of)\s*([\d.]+)/i);
    if (m) {
      const pct = parseFloat(m[1]), base = parseFloat(m[2]);
      const val = base * (pct / 100);
      return { expr: pct + "% of " + base, value: val, extra: "total with tip: " + (base + val).toFixed(2) };
    }
    // strip a leading "what is" / "calculate" / trailing "?"
    let expr = text.replace(/^(what'?s|what is|calculate|compute|evaluate)\s+/i, '').replace(/\?+$/,'').trim();
    expr = expr.replace(/x/gi, '*').replace(/×/g,'*').replace(/÷/g,'/');
    const value = evalExpression(expr);
    return { expr, value };
  }

  /* ---------------------------------------------------------
     Tool 2: date math
  --------------------------------------------------------- */
  const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
  function parseDateToken(tok){
    tok = tok.trim();
    let m = tok.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
    m = tok.match(/^([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})$/);
    if (m) {
      const mi = MONTHS.indexOf(m[1].toLowerCase());
      if (mi >= 0) return new Date(Date.UTC(+m[3], mi, +m[2]));
    }
    m = tok.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
    if (m) {
      const mi = MONTHS.indexOf(m[2].toLowerCase());
      if (mi >= 0) return new Date(Date.UTC(+m[3], mi, +m[1]));
    }
    m = tok.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return new Date(Date.UTC(+m[3], +m[1]-1, +m[2]));
    return null;
  }
  function fmtDate(d){
    return d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric', timeZone:'UTC' });
  }
  function runDateMath(text){
    let m = text.match(/days between (.+?) and (.+?)(?:\?|$)/i);
    if (m) {
      const a = parseDateToken(m[1]), b = parseDateToken(m[2]);
      if (!a || !b) throw new Error("couldn't parse one of those dates — try YYYY-MM-DD");
      const days = Math.round((b - a) / 86400000);
      return `${Math.abs(days)} days between ${fmtDate(a)} and ${fmtDate(b)}`;
    }
    m = text.match(/(add|subtract)\s+(\d+)\s+(day|days|week|weeks|month|months)\s+(?:to|from)\s+(.+)/i);
    if (m) {
      const sign = m[1].toLowerCase() === 'add' ? 1 : -1;
      const n = parseInt(m[2], 10) * sign;
      const unit = m[3].toLowerCase();
      const base = parseDateToken(m[4].trim());
      if (!base) throw new Error("couldn't parse that date — try YYYY-MM-DD");
      const d = new Date(base);
      if (unit.startsWith('day')) d.setUTCDate(d.getUTCDate() + n);
      else if (unit.startsWith('week')) d.setUTCDate(d.getUTCDate() + n*7);
      else d.setUTCMonth(d.getUTCMonth() + n);
      return `${fmtDate(d)}`;
    }
    m = text.match(/what day (?:of the week )?is\s+(.+)/i);
    if (m) {
      const d = parseDateToken(m[1].trim());
      if (!d) throw new Error("couldn't parse that date — try YYYY-MM-DD");
      return fmtDate(d);
    }
    throw new Error("couldn't find a recognizable date pattern");
  }

  /* ---------------------------------------------------------
     Tool 3: unit conversion
  --------------------------------------------------------- */
  const UNIT_ALIASES = {
    mm:'mm', millimeter:'mm', millimeters:'mm',
    cm:'cm', centimeter:'cm', centimeters:'cm',
    m:'m', meter:'m', meters:'m', metre:'m', metres:'m',
    km:'km', kilometer:'km', kilometers:'km', kilometre:'km', kilometres:'km',
    'in':'in', inch:'in', inches:'in',
    ft:'ft', foot:'ft', feet:'ft',
    yd:'yd', yard:'yd', yards:'yd',
    mi:'mi', mile:'mi', miles:'mi',
    mg:'mg', milligram:'mg', milligrams:'mg',
    g:'g', gram:'g', grams:'g',
    kg:'kg', kilogram:'kg', kilograms:'kg',
    lb:'lb', lbs:'lb', pound:'lb', pounds:'lb',
    oz:'oz', ounce:'oz', ounces:'oz',
    ml:'ml', milliliter:'ml', milliliters:'ml',
    l:'l', liter:'l', liters:'l', litre:'l', litres:'l',
    gal:'gal', gallon:'gal', gallons:'gal',
    c:'c', celsius:'c', f:'f', fahrenheit:'f', k:'k', kelvin:'k'
  };
  const LENGTH_TO_M = { mm:0.001, cm:0.01, m:1, km:1000, 'in':0.0254, ft:0.3048, yd:0.9144, mi:1609.344 };
  const WEIGHT_TO_G = { mg:0.001, g:1, kg:1000, lb:453.592, oz:28.3495 };
  const VOLUME_TO_L = { ml:0.001, l:1, gal:3.78541 };
  function convertTemp(v, from, to){
    let c;
    if (from === 'c') c = v;
    else if (from === 'f') c = (v - 32) * 5/9;
    else c = v - 273.15;
    if (to === 'c') return c;
    if (to === 'f') return c * 9/5 + 32;
    return c + 273.15;
  }
  function runUnitConvert(text){
    const m = text.match(/([\d.]+)\s*([a-zA-Z°]+)\s*(?:to|in|=>|->)\s*([a-zA-Z°]+)/i);
    if (!m) throw new Error("expected a pattern like '10 miles to km'");
    const value = parseFloat(m[1]);
    const fromRaw = m[2].toLowerCase().replace('°','');
    const toRaw = m[3].toLowerCase().replace('°','');
    const from = UNIT_ALIASES[fromRaw], to = UNIT_ALIASES[toRaw];
    if (!from || !to) throw new Error(`unrecognized unit "${!from ? m[2] : m[3]}"`);
    if (from in LENGTH_TO_M && to in LENGTH_TO_M) {
      const result = value * LENGTH_TO_M[from] / LENGTH_TO_M[to];
      return { value: result, text: `${value} ${from} = ${round(result)} ${to}` };
    }
    if (from in WEIGHT_TO_G && to in WEIGHT_TO_G) {
      const result = value * WEIGHT_TO_G[from] / WEIGHT_TO_G[to];
      return { value: result, text: `${value} ${from} = ${round(result)} ${to}` };
    }
    if (from in VOLUME_TO_L && to in VOLUME_TO_L) {
      const result = value * VOLUME_TO_L[from] / VOLUME_TO_L[to];
      return { value: result, text: `${value} ${from} = ${round(result)} ${to}` };
    }
    if (['c','f','k'].includes(from) && ['c','f','k'].includes(to)) {
      const result = convertTemp(value, from, to);
      return { value: result, text: `${value}°${from.toUpperCase()} = ${round(result)}°${to.toUpperCase()}` };
    }
    throw new Error(`can't convert between "${from}" and "${to}" — different unit families`);
  }
  function round(n){ return Math.round(n * 10000) / 10000; }

  /* ---------------------------------------------------------
     Tool 4: text tools
  --------------------------------------------------------- */
  function runTextTool(text){
    let m = text.match(/^(?:count words? in|word count(?: of)?)[:\s]+(.+)/i);
    if (m) {
      const t = m[1].trim();
      const words = t.split(/\s+/).filter(Boolean).length;
      return `${words} words, ${t.length} characters (${t.replace(/\s/g,'').length} excluding spaces)`;
    }
    m = text.match(/^uppercase[:\s]+(.+)/i);
    if (m) return m[1].toUpperCase();
    m = text.match(/^lowercase[:\s]+(.+)/i);
    if (m) return m[1].toLowerCase();
    m = text.match(/^title case[:\s]+(.+)/i);
    if (m) return m[1].replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
    m = text.match(/^reverse(?: text)?[:\s]+(.+)/i);
    if (m) return m[1].split('').reverse().join('');
    m = text.match(/^slugify[:\s]+(.+)/i);
    if (m) return m[1].toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    throw new Error("try: 'count words in ...', 'uppercase ...', 'lowercase ...', 'title case ...', 'reverse ...', or 'slugify ...'");
  }

  /* ---------------------------------------------------------
     Tool 5: JSON formatter / validator
  --------------------------------------------------------- */
  function runJsonTool(text){
    const m = text.match(/^(?:format|validate|pretty[- ]?print)\s*json[:\s]+([\s\S]+)/i);
    const payload = (m ? m[1] : text).trim();
    try {
      const parsed = JSON.parse(payload);
      return "valid JSON ✓\n\n" + JSON.stringify(parsed, null, 2);
    } catch (e) {
      throw new Error("invalid JSON — " + e.message);
    }
  }

  /* ---------------------------------------------------------
     Tool 6: planner — goal → checklist
  --------------------------------------------------------- */
  const PLAN_TEMPLATES = [
    { match: /website|portfolio|landing page/i, steps: [
      "Define the goal and target audience for the site",
      "Sketch the sitemap and page structure",
      "Pick a stack and set up hosting/deployment",
      "Build the core pages, mobile-first",
      "Write and proofread real content (no placeholder text)",
      "Test on real devices, fix accessibility issues",
      "Deploy, then share it for feedback"
    ]},
    { match: /learn|study|skill|course/i, steps: [
      "Write down exactly what 'done' looks like",
      "Find 1-2 solid resources (course, book, docs)",
      "Block recurring practice time on the calendar",
      "Build one small real project with the skill",
      "Get feedback from someone more experienced",
      "Teach or write up what you learned to lock it in"
    ]},
    { match: /party|event|wedding|trip|travel/i, steps: [
      "Set the date, budget, and guest/attendee count",
      "Book the venue or key reservations early",
      "Draft a timeline for the day",
      "Handle invitations / bookings",
      "Confirm details with vendors or venues a week out",
      "Prepare a day-of checklist so nothing's forgotten"
    ]},
    { match: /interview|job|resume|résumé/i, steps: [
      "Research the company and the specific role",
      "Tailor your résumé to the job description",
      "Prepare 3-5 stories using the STAR format",
      "Practice out loud, ideally with another person",
      "Prepare thoughtful questions to ask them",
      "Follow up with a short thank-you note after"
    ]},
    { match: /launch|ship|ship it|product|startup|app/i, steps: [
      "Nail down the smallest useful version (MVP)",
      "Build it, cutting anything non-essential",
      "Test it with 3-5 real users before wide release",
      "Fix the sharpest edges they hit",
      "Prepare a simple launch announcement",
      "Ship, then watch usage/feedback closely for a week"
    ]}
  ];
  function runPlanner(text){
    const goal = text.replace(/^(plan|help me plan|steps to|how do i|how to)\s+/i, '').trim() || text;
    for (const t of PLAN_TEMPLATES) {
      if (t.match.test(goal)) return { goal, steps: t.steps };
    }
    return { goal, steps: [
      "Write one sentence defining what success looks like",
      "List what you already have vs. what's missing",
      "Break it into the smallest first concrete step",
      "Do that step today, even imperfectly",
      "Get feedback, then repeat with the next step"
    ]};
  }

  /* ---------------------------------------------------------
     Intent routing
  --------------------------------------------------------- */
  function classify(text){
    const t = text.trim();
    if (/json/i.test(t) && /[{[]/.test(t)) return 'json';
    if (/convert|\d+\s*[a-zA-Z°]+\s*(to|in|->|=>)\s*[a-zA-Z°]+/i.test(t)) return 'unit';
    if (/days between|what day is|add \d+ (day|week|month)|subtract \d+ (day|week|month)/i.test(t)) return 'date';
    if (/count words|word count|^uppercase|^lowercase|^title case|^reverse|^slugify/i.test(t)) return 'text';
    if (/^[\d\s+\-*/^%().]+$/.test(t) && /\d/.test(t)) return 'calc';
    if (/^(what'?s|what is|calculate|compute|evaluate)\b/i.test(t) && /\d/.test(t)) return 'calc';
    if (/%\s*(tip on|of)/i.test(t)) return 'calc';
    if (/^plan|help me plan|steps to|how do i|how to/i.test(t)) return 'plan';
    return 'plan'; // sensible default: treat unmatched free text as a goal to break down
  }

  const TOOLS_INFO = [
    { name:'calculator', desc:'Arithmetic, percentages, tips — "what is 82.5 * 1.18"' },
    { name:'date_math', desc:'Date differences, add/subtract, weekday lookup' },
    { name:'unit_convert', desc:'Length, weight, volume, temperature' },
    { name:'text_tools', desc:'Word count, case conversion, slugify, reverse' },
    { name:'json_tool', desc:'Validate and pretty-print JSON' },
    { name:'planner', desc:'Breaks an open-ended goal into concrete steps' }
  ];
  const EXAMPLES = [
    "convert 12 miles to km",
    "days between 2026-01-01 and 2026-12-25",
    "15% tip on 82.50",
    "count words in: the quick brown fox jumps",
    "format json: {\"ok\": true, \"n\": 1}",
    "plan a birthday party"
  ];

  const trace = document.getElementById('trace');
  const form = document.getElementById('composer');
  const input = document.getElementById('goalInput');
  const chipsEl = document.getElementById('chips');
  const toolListEl = document.getElementById('toolList');

  function addMsg(role, label, body){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = `<div class="role"><span class="dot"></span>${label}</div><div class="body"></div>`;
    div.querySelector('.body').textContent = body;
    trace.appendChild(div);
    trace.scrollTop = trace.scrollHeight;
    return div;
  }

  function handleGoal(text){
    addMsg('goal', 'Goal', text);
    const intent = classify(text);
    let thought, actionLine, observation, answer, isError = false;

    try {
      if (intent === 'calc') {
        thought = "This reads as arithmetic — routing to the calculator tool.";
        const r = runCalculator(text);
        actionLine = `calculator("${r.expr}")`;
        observation = `= ${round(r.value)}` + (r.extra ? `\n${r.extra}` : '');
        answer = `${r.expr} = ${round(r.value)}` + (r.extra ? ` — ${r.extra}` : '');
      } else if (intent === 'date') {
        thought = "This references specific dates — routing to date_math.";
        const r = runDateMath(text);
        actionLine = `date_math("${text}")`;
        observation = r;
        answer = r;
      } else if (intent === 'unit') {
        thought = "This looks like a unit conversion request — routing to unit_convert.";
        const r = runUnitConvert(text);
        actionLine = `unit_convert("${text}")`;
        observation = r.text;
        answer = r.text;
      } else if (intent === 'text') {
        thought = "This is a text-transformation request — routing to text_tools.";
        const r = runTextTool(text);
        actionLine = `text_tools("${text}")`;
        observation = r;
        answer = r;
      } else if (intent === 'json') {
        thought = "Input contains JSON-like structure — routing to json_tool.";
        const r = runJsonTool(text);
        actionLine = `json_tool(<payload>)`;
        observation = r;
        answer = r.split('\n')[0];
      } else {
        thought = "No single-shot tool fits — treating this as an open-ended goal and breaking it into steps.";
        const r = runPlanner(text);
        actionLine = `planner("${r.goal}")`;
        observation = r.steps.map((s,idx) => `${idx+1}. ${s}`).join('\n');
        answer = `${r.steps.length}-step plan for "${r.goal}" (see above)`;
      }
    } catch (e) {
      isError = true;
      thought = "Attempted to route this, but the tool couldn't complete it.";
      actionLine = intent + "(...)";
      observation = e.message;
      answer = null;
    }

    addMsg('thought', 'Thought', thought);
    addMsg('action', 'Action', actionLine);
    if (isError) {
      addMsg('error', 'Observation — error', observation);
    } else {
      addMsg('observation', 'Observation', observation);
      addMsg('answer', 'Answer', answer);
    }
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    handleGoal(text);
    input.value = '';
    input.focus();
  });

  EXAMPLES.forEach(function(ex){
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = ex;
    chip.addEventListener('click', function(){ input.value = ex; form.dispatchEvent(new Event('submit', {cancelable:true})); });
    chipsEl.appendChild(chip);
  });

  TOOLS_INFO.forEach(function(t){
    const li = document.createElement('li');
    li.innerHTML = `<span class="tool-dot"></span><div><div class="tool-name">${t.name}</div><div class="tool-desc">${t.desc}</div></div>`;
    toolListEl.appendChild(li);
  });

  addMsg('answer', 'Waypoint', "I'm a small tool-using agent. Give me a goal — I'll decide which tool fits, run it, and show you my reasoning as I go. Try one of the examples below.");

  window.__waypointTest = { runCalculator, runDateMath, runUnitConvert, runTextTool, runJsonTool, runPlanner, classify };
})();
</script>
</body>
</html>
